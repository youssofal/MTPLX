[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtplx"
version = "2.4.0"
description = "Native MTP speculative decoding for Qwen3-Next on Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Youssof Altoukhi", email = "business@youssofal.com"}]
dependencies = [
  "fastapi>=0.136",
  "huggingface-hub>=0.36",
  # Vision is advertised on the base install (app attachments, image_url on
  # the server) and mtplx.vision.processing imports PIL at module load, so
  # Pillow must be a base dependency, not a [server] extra (#103).
  "pillow>=10",
  # 0.32.0 exactness-gated 2026-07-11: byte-identical greedy 128-tok output
  # vs 0.31.3 on Optimized-Speed q4 turbo D3 (same 34 verify calls), and 103
  # kernel/paged-verifier/graphbank/sustained tests green under 0.32.0.
  "mlx>=0.31,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.31,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
  # transformers 5.13.0 changed AutoTokenizer.register to require a config
  # class as the key; mlx-lm 0.31.x still registers by name
  # ("NewlineTokenizer") and crashes at import, killing every fresh install
  # at model load (#136, #135; PR #137 by @davidtai). 5.13.1 restored
  # compatibility (verified 2026-07-11: mlx-lm 0.31.3 import + real Speed-q4
  # tokenizer load + chat template green on 5.13.1; 5.13.0 still crashes),
  # so only the poisoned release stays excluded.
  "transformers<5.14,!=5.13.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "nanobind>=2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy>=2",
  "pydantic>=2",
  "rich>=14",
  "safetensors>=0.6",
  "uvicorn>=0.46",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["mlx", "apple-silicon", "speculative-decoding", "qwen", "mtp", "local-ai"]

[project.urls]
Homepage = "https://github.com/youssofal/mtplx"
Documentation = "https://github.com/youssofal/mtplx/tree/main/docs"
Issues = "https://github.com/youssofal/mtplx/issues"
Citation = "https://github.com/youssofal/mtplx/blob/main/CITATION.cff"

[project.optional-dependencies]
competitors = [
  "dflash-mlx==0.1.0",
]
server = [
  "fastapi>=0.136",
  "llguidance>=1.7",
  "uvicorn>=0.46",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.8",
  "twine>=5",
]

[project.scripts]
mtplx = "mtplx.cli:main"
mtplx-tune = "mtplx.cli:main_tune"

[tool.setuptools.packages.find]
include = ["mtplx*", "vllm_metal*"]

[tool.setuptools.package-data]
mtplx = ["templates/**/*.jinja"]
"mtplx.benchmarks" = ["prompts/*.jsonl"]
"mtplx.dashboard" = ["_static/**/*"]
"vllm_metal.metal" = [
  "README.md",
  "*.cpp",
  "kernels_v1/*.metal",
  "kernels_v2/*.metal",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
