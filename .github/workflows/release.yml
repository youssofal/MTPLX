name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build, such as v0.3.5"
        required: true
        default: "v0.3.5"
      publish_to_pypi:
        description: "Publish the built artifacts to PyPI through Trusted Publishing"
        type: boolean
        required: true
        default: false
      publish_release_wheels:
        description: "Publish the sdist and the macOS 14 arm64 wheels attached to the GitHub release of `ref` (a version tag) to PyPI, keeping files PyPI already has"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-artifacts:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_release_wheels) }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Validate PyPI publish ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
        env:
          PUBLISH_REF: ${{ inputs.ref }}
        run: |
          case "$PUBLISH_REF" in
            v*) ;;
            *)
              echo "PyPI publishing requires an explicit version tag ref, not '$PUBLISH_REF'." >&2
              exit 1
              ;;
          esac
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: scripts/fresh_venv_smoke.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*

  publish-pypi:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi }}
    needs: build-artifacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mtplx
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/

  # The wheels that carry the native executor are built on a Mac by the release assembler
  # (native/package.py, one per Python, macOS 14 and newer) and attached to the GitHub release;
  # this publishes those files to PyPI under the same trusted publisher.
  publish-release-wheels:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release_wheels }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mtplx
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release's sdist and macOS 14 arm64 wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.ref }}
        run: |
          case "$TAG" in
            v*) ;;
            *)
              echo "Publishing release files requires a version tag ref, not '$TAG'." >&2
              exit 1
              ;;
          esac
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "mtplx-${TAG#v}-cp3*-cp3*-macosx_14_0_arm64.whl" \
            --pattern "mtplx-${TAG#v}.tar.gz"
          ls -la dist
          test "$(find dist -name '*.whl' | wc -l)" -ge 1
      # 2.13.0 first reached PyPI with a wheel that had no executor. Every wheel published here must carry the
      # compiled executor for its own Python.
      - name: Refuse a wheel without the native executor
        run: |
          for wheel in dist/*.whl; do
            tag="$(basename "$wheel" | cut -d- -f3)"
            if ! unzip -Z1 "$wheel" | grep -qx "mtplx/_engine.cpython-${tag#cp}-darwin.so"; then
              echo "$wheel does not carry mtplx/_engine for $tag" >&2
              exit 1
            fi
          done
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
