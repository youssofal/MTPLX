name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-mlx-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m pytest tests/test_no_mlx_imports.py tests/test_public_cli.py tests/test_runtime_kpis.py tests/test_server_openai.py tests/test_openai_bridge.py tests/test_thermal.py tests/test_cache_state.py
      - name: Memory-plan safe points and existing pressure backstops
        run: >-
          python -m pytest tests/test_memory_plan_safe_point.py
          tests/test_memory_pressure_guard.py tests/test_memory_plan.py
          tests/test_model_scheduler.py tests/test_model_scheduler_persistence.py
          tests/test_prefill_admission_shed.py tests/test_ssd_spill.py
      - run: python -m compileall -q mtplx tests
