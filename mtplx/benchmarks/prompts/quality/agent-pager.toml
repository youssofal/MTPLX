"pager.py" = '''
def paginate(items, page, per_page):
    """Return the items on a 1-based page.

    Each page holds ``per_page`` items and the last page may hold fewer.
    A page number below 1 or past the last page gives an empty list.
    """
    start = page * per_page
    return items[start:start + per_page]


def page_count(total, per_page):
    """Number of pages needed to show ``total`` items."""
    return total // per_page
'''
"test_pager.py" = '''
import unittest

from pager import page_count, paginate


class PagerTests(unittest.TestCase):
    def test_first_page(self):
        self.assertEqual(paginate(list(range(10)), 1, 3), [0, 1, 2])

    def test_last_page_is_partial(self):
        self.assertEqual(paginate(list(range(10)), 4, 3), [9])

    def test_page_count(self):
        self.assertEqual(page_count(10, 3), 4)
        self.assertEqual(page_count(9, 3), 3)
        self.assertEqual(page_count(0, 3), 0)


if __name__ == "__main__":
    unittest.main()
'''

[reference_files]
"pager.py" = '''
def paginate(items, page, per_page):
    """Return the items on a 1-based page."""
    if page < 1:
        return []
    start = (page - 1) * per_page
    return items[start:start + per_page]


def page_count(total, per_page):
    """Number of pages needed to show ``total`` items."""
    return -(-total // per_page)
'''
