id = "tool-search-code"
kind = "tool"
prompt = '''
Where is the function `load_config` defined in the `src` directory of this repository?
'''
tools_json = '''
[
  {"type": "function", "function": {
    "name": "search_code",
    "description": "Search the files under a directory for a text or regular-expression pattern.",
    "parameters": {"type": "object", "properties": {
      "pattern": {"type": "string"},
      "directory": {"type": "string"}}, "required": ["pattern", "directory"]}}},
  {"type": "function", "function": {
    "name": "read_file",
    "description": "Read one file.",
    "parameters": {"type": "object", "properties": {
      "path": {"type": "string"}}, "required": ["path"]}}},
  {"type": "function", "function": {
    "name": "run_command",
    "description": "Run a shell command.",
    "parameters": {"type": "object", "properties": {
      "command": {"type": "string"}}, "required": ["command"]}}}
]
'''

[[expect_calls]]
name = "search_code"
args = { pattern = { contains = "load_config" }, directory = { one_of = ["src", "src/", "./src", "./src/"] } }
