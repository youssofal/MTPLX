[files]
"text_utils.py" = '''
import re


def slugify(title):
    """Turn a title into a URL slug.

    The slug holds lowercase ASCII letters and digits, with words separated
    by single hyphens and no hyphen at either end. Accented letters lose
    their accents ("é" becomes "e"); every other character separates words.
    """
    slug = title.lower()
    slug = re.sub(r"[^a-z0-9]", "-", slug)
    return slug
'''
