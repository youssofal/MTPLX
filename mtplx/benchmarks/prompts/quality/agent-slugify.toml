[reference_files]
"text_utils.py" = '''
import re
import unicodedata


def slugify(title):
    """Turn a title into a URL slug."""
    plain = unicodedata.normalize("NFKD", title).encode("ascii", "ignore").decode("ascii")
    return re.sub(r"[^a-z0-9]+", "-", plain.lower()).strip("-")
'''
