"inventory.py" = '''
class OutOfStock(Exception):
    """Raised when more units are requested than are in stock."""


def _check_quantity(quantity):
    if isinstance(quantity, bool) or not isinstance(quantity, int) or quantity <= 0:
        raise ValueError("quantity must be a positive integer")


class Inventory:
    def __init__(self):
        self._stock = {}

    def add(self, item, quantity):
        """Add ``quantity`` units of ``item``."""
        _check_quantity(quantity)
        self._stock[item] = self._stock.get(item, 0) + quantity

    def count(self, item):
        """Units of ``item`` in stock (0 for an unknown item)."""
        return self._stock.get(item, 0)

    def remove(self, item, quantity):
        """Take ``quantity`` units of ``item`` out of stock.

        Raises ValueError when ``quantity`` is not a positive int (a bool is
        not accepted) and OutOfStock when fewer units are in stock; in both
        cases the stock is left unchanged. An item whose count reaches zero
        is forgotten, so it no longer appears in ``items()``.
        """
        raise NotImplementedError

    def items(self):
        """Names of the items in stock, sorted."""
        return sorted(self._stock)
'''
"test_inventory.py" = '''
import unittest

from inventory import Inventory


class InventoryTests(unittest.TestCase):
    def test_add_and_count(self):
        inv = Inventory()
        inv.add("bolt", 3)
        inv.add("bolt", 2)
        self.assertEqual(inv.count("bolt"), 5)

    def test_add_rejects_bad_quantity(self):
        with self.assertRaises(ValueError):
            Inventory().add("bolt", 0)


if __name__ == "__main__":
    unittest.main()
'''

